<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Height in cm</th>
            <th>Height in inches</th>
        </tr>
        <tr>
            <td>Abhu</td>
            <td>180</td>
            <td>73.5</td>
        </tr>
        <tr>
            <td>Saanvi</td>
            <td>150</td>
            <td>62.5</td>
        </tr>
        <tr>
            <td>Rahil</td>
            <td>175</td>
            <td>70.5</td>

        </tr>
        
    </table>
    <table>
        <tr>
            <th rowspan="2">Name</th>
            <th colspan="2">Height</th>
        </tr>
        <tr>
            <th>in cm</th>
            <th>in inches</th>
        </tr>
         <tr>
            <td>Abhu</td>
            <td>180</td>
            <td>73.5</td>
        </tr>
        <tr>
            <td>Saanvi</td>
            <td>150</td>
            <td>62.5</td>
        </tr>
        <tr>
            <td>Rahil</td>
            <td>175</td>
            <td>70.5</td>

        </tr>
    </table>
    
</body>
</html>
